groups:
  - name: infra_alerts
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend is down"
          description: "Backend didn't answer to Prometheus in more than 2 minutes."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Postgres is down"
          description: "Postgres didn't answer to Prometheus in more than 2 minutes."

      - alert: NginxDown
        expr: up{job="nginx"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Nginx is down"
          description: "Nginx didn't answer to Prometheus in more than 5 minutes."

      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is down"
          description: "Redis didn't answer to Prometheus in more than 5 minutes."